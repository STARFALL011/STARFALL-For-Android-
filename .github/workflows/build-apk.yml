
name: Build STARFALL APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build STARFALL APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Android project
        id: project
        shell: bash
        run: |
          echo "Repository contents:"
          ls -la

          ANDROID_DIR=$(find . \
            -type d \
            -name android \
            -not -path './.git/*' \
            -not -path '*/node_modules/*' \
            -print -quit)

          if [ -z "$ANDROID_DIR" ]; then
            echo "ERROR: Walang android folder sa repository."
            echo "Kailangan munang idagdag ang Android project."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$ANDROID_DIR")
          PROJECT_DIR=$(realpath "$PROJECT_DIR")

          if [ ! -f "$PROJECT_DIR/package.json" ]; then
            echo "ERROR: Walang package.json katabi ng android folder."
            echo "Project folder: $PROJECT_DIR"
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found project: $PROJECT_DIR"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"
          yes | sdkmanager --licenses

      - name: Install project dependencies
        working-directory: ${{ steps.project.outputs.dir }}
        run: npm install

      - name: Build web assets
        working-directory: ${{ steps.project.outputs.dir }}
        run: npm run build --if-present

      - name: Sync Capacitor Android
        working-directory: ${{ steps.project.outputs.dir }}
        run: npx cap sync android

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: STARFALL-debug-apk
          path: ${{ steps.project.outputs.dir }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
